name: Seckill HUD MAX Direct Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        
    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        
    - name: Generate Android Project Structure
      run: |
        echo "Creating project directories..."
        mkdir -p app/src/main/cpp app/src/main/java/com/seckill/hud app/src/main/res/values app/src/main/res/drawable
        
        # 1. 创建根目录 build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF

        # 2. 创建 settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "SeckillHUDMax"
        include ':app'
        EOF

        # 3. 创建 app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.seckill.hud'
            compileSdk 34
            defaultConfig {
                applicationId "com.seckill.hud.max"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0"
                externalNativeBuild {
                    cmake {
                        cppFlags "-std=c++17 -O3"
                    }
                }
            }
            buildTypes {
                release {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            externalNativeBuild {
                cmake {
                    path file('src/main/cpp/CMakeLists.txt')
                    version '3.22.1'
                }
            }
        }
        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.9.0'
        }
        EOF

        # 4. 创建 CMakeLists.txt (C++ 毫秒级授时与核心底层)
        cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
        cmake_minimum_required(VERSION 3.22.1)
        project("seckill_core")
        add_library(seckill_core SHARED native-lib.cpp)
        find_library(log-lib log)
        target_link_libraries(seckill_core ${log-lib})
        EOF

        # 5. 创建 native-lib.cpp
        cat << 'EOF' > app/src/main/cpp/native-lib.cpp
        #include <jni.h>
        #include <string>
        #include <chrono>

        extern "C" JNIEXPORT jlong JNICALL
        Java_com_seckill_hud_MainActivity_getPreciseNanos(JNIEnv* env, jobject thiz) {
            auto now = std::chrono::high_resolution_clock::now();
            return std::chrono::duration_cast<std::chrono::nanoseconds>(now.time_since_epoch()).count();
        }
        EOF

        # 6. 创建 MainActivity.java
        cat << 'EOF' > app/src/main/java/com/seckill/hud/MainActivity.java
        package com.seckill.hud;

        import android.os.Bundle;
        import android.widget.TextView;
        import androidx.appcompat.app.AppCompatActivity;

        public class MainActivity extends AppCompatActivity {
            static {
                System.loadLibrary("seckill_core");
            }
            public native long getPreciseNanos();

            @Override
            protected void onCreate(Bundle savedInstanceState) {
                super.onCreate(savedInstanceState);
                TextView tv = new TextView(this);
                tv.setText("Seckill HUD MAX Running\nNano Time: " + getPreciseNanos());
                tv.setTextSize(20);
                setContentView(tv);
            }
        }
        EOF

        # 7. 创建 AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="Seckill HUD MAX"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.Light.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 8. 生成 Gradle 包装器所需文件
        gradle wrapper
        
    - name: Compile APK with Gradle
      run: |
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Seckill-HUD-MAX-Release
        path: app/build/outputs/apk/debug/*.apk
