name: Seckill HUD MAX Fixed Gradle Build

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'zulu'
        
    - name: Set up Android NDK
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r25c
        
    - name: Assemble Stable Project
      run: |
        mkdir -p app/src/main/cpp app/src/main/java/com/example/seckillcloc app/src/main/res/xml app/src/main/res/values app/src/main/res/layout
        
        # 1. 根目录 build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
            }
        }
        task clean(type: Delete) {
            delete rootProject.buildDir
        }
        EOF

        # 2. settings.gradle
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "SeckillCloc"
        include ':app'
        EOF

        # 3. app/build.gradle
        cat << 'EOF' > app/build.gradle
        plugins {
            id 'com.android.application'
        }
        android {
            namespace 'com.example.seckillcloc'
            compileSdk 34
            defaultConfig {
                applicationId "com.example.seckillcloc"
                minSdk 26
                targetSdk 34
                versionCode 1
                versionName "1.0.0"
                externalNativeBuild {
                    cmake {
                        cppFlags "-std=c++17 -O3"
                    }
                }
            }
            buildTypes {
                release {
                    minifyEnabled true
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
                debug {
                    minifyEnabled false
                    proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
                }
            }
            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }
            externalNativeBuild {
                cmake {
                    path file('src/main/cpp/CMakeLists.txt')
                    version '3.22.1'
                }
            }
        }
        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
        }
        EOF

        # 4. CMakeLists.txt
        cat << 'EOF' > app/src/main/cpp/CMakeLists.txt
        cmake_minimum_required(VERSION 3.22.1)
        project("seckill_core")
        add_library(seckill_core SHARED native-lib.cpp)
        find_library(log-lib log)
        target_link_libraries(seckill_core ${log-lib})
        EOF

        # 5. C++ 授时内核 native-lib.cpp
        cat << 'EOF' > app/src/main/cpp/native-lib.cpp
        #include <jni.h>
        #include <string>
        #include <sys/time.h>
        #include <sys/socket.h>
        #include <netdb.h>
        #include <arpa/inet.h>
        #include <unistd.h>
        #include <chrono>

        static long long time_offset_ms = 0;
        #define NTP_TIMESTAMP_DELTA 2208988800ull

        extern "C" JNIEXPORT jlong JNICALL
        Java_com_example_seckillcloc_NativeTime_syncNtpServer(JNIEnv *env, jobject thiz, jstring host_) {
            const char *host = env->GetStringUTFChars(host_, nullptr);
            struct sockaddr_in serv_addr;
            int sockfd = socket(AF_INET, SOCK_DGRAM, IPPROTO_UDP);
            if (sockfd < 0) {
                env->ReleaseStringUTFChars(host_, host);
                return 0;
            }
            struct timeval tv{2, 0};
            setsockopt(sockfd, SOL_SOCKET, SO_RCVTIMEO, (const char*)&tv, sizeof(tv));
            struct hostent *server = gethostbyname(host);
            if (!server) { close(sockfd); env->ReleaseStringUTFChars(host_, host); return 0; }

            memset(&serv_addr, 0, sizeof(serv_addr));
            serv_addr.sin_family = AF_INET;
            memcpy(&serv_addr.sin_addr.s_addr, server->h_addr, server->h_length);
            serv_addr.sin_port = htons(123);

            unsigned long msg[12] = {0};
            msg[0] = htonl(0x1B000000);
            auto t1 = std::chrono::high_resolution_clock::now();
            sendto(sockfd, (char*)msg, sizeof(msg), 0, (struct sockaddr*)&serv_addr, sizeof(serv_addr));
            if (recv(sockfd, (char*)msg, sizeof(msg), 0) < 0) { close(sockfd); env->ReleaseStringUTFChars(host_, host); return 0; }
            auto t2 = std::chrono::high_resolution_clock::now();
            close(sockfd);
            env->ReleaseStringUTFChars(host_, host);

            unsigned long tntp = ntohl(msg[40]);
            unsigned long long ntp_time_ms = ((unsigned long long)tntp - NTP_TIMESTAMP_DELTA) * 1000ULL;
            long long rtt_ms = std::chrono::duration_cast<std::chrono::milliseconds>(t2 - t1).count();
            long long current_local_ms = std::chrono::duration_cast<std::chrono::milliseconds>(std::chrono::system_clock::now().time_since_epoch()).count();

            time_offset_ms = (ntp_time_ms + (rtt_ms / 2)) - current_local_ms;
            return time_offset_ms;
        }

        extern "C" JNIEXPORT jlong JNICALL
        Java_com_example_seckillcloc_NativeTime_getNativeTimestamp(JNIEnv *env, jobject thiz) {
            struct timeval tv;
            gettimeofday(&tv, nullptr);
            return ((long long)tv.tv_sec * 1000LL + (long long)tv.tv_usec / 1000LL) + time_offset_ms;
        }
        EOF

        # 6. Java 桥接与辅助类
        cat << 'EOF' > app/src/main/java/com/example/seckillcloc/NativeTime.java
        package com.example.seckillcloc;
        public class NativeTime {
            static { System.loadLibrary("seckill_core"); }
            public static native long syncNtpServer(String host);
            public static native long getNativeTimestamp();
        }
        EOF

        cat << 'EOF' > app/src/main/java/com/example/seckillcloc/TimeSynchronizer.java
        package com.example.seckillcloc;
        import java.net.HttpURLConnection;
        import java.net.URL;
        public class TimeSynchronizer {
            public static long syncHttpOffset(String urlStr) {
                try {
                    long start = System.currentTimeMillis();
                    URL url = new URL(urlStr);
                    HttpURLConnection conn = (HttpURLConnection) url.openConnection();
                    conn.setRequestMethod("HEAD");
                    conn.connect();
                    long date = conn.getDate();
                    long end = System.currentTimeMillis();
                    long rtt = end - start;
                    conn.disconnect();
                    if (date > 0) return (date + (rtt / 2)) - end;
                } catch (Exception e) { e.printStackTrace(); }
                return 0L;
            }
        }
        EOF

        # 7. 悬浮窗服务
        cat << 'EOF' > app/src/main/java/com/example/seckillcloc/FloatingHudService.kt
        package com.example.seckillcloc

        import android.app.Service
        import android.content.Intent
        import android.graphics.Color
        import android.graphics.PixelFormat
        import android.os.IBinder
        import android.view.Choreographer
        import android.view.Gravity
        import android.view.WindowManager
        import android.widget.TextView
        import java.text.SimpleDateFormat
        import java.util.*

        class FloatingHudService : Service() {
            private lateinit var wm: WindowManager
            private lateinit var hudView: TextView
            private val formatter = SimpleDateFormat("HH:mm:ss.SSS", Locale.getDefault())
            private var timeOffsetMs: Int = 0
            private var isAutoMode: Boolean = false
            private var hasFired: Boolean = false

            private val frameCallback = object : Choreographer.FrameCallback {
                override fun doFrame(frameTimeNanos: Long) {
                    val currentTs = NativeTime.getNativeTimestamp() + timeOffsetMs
                    val msPart = currentTs % 60000
                    hudView.text = formatter.format(Date(currentTs))

                    if (msPart > 59000) {
                        hudView.setTextColor(Color.parseColor("#FF3B30"))
                        if (isAutoMode && !hasFired && msPart > 59980) {
                            hasFired = true
                            val location = IntArray(2)
                            hudView.getLocationOnScreen(location)
                            AutoSniperService.instance?.executeAutoClick(
                                location[0] + (hudView.width / 2f),
                                location[1] + (hudView.height / 2f)
                            )
                            hudView.text = "FIRE!"
                        }
                    } else {
                        hudView.setTextColor(Color.parseColor("#00FF00"))
                        hasFired = false
                    }
                    Choreographer.getInstance().postFrameCallback(this)
                }
            }

            override fun onCreate() {
                super.onCreate()
                wm = getSystemService(WINDOW_SERVICE) as WindowManager
                hudView = TextView(this).apply {
                    textSize = 28f
                    setShadowLayer(4f, 2f, 2f, Color.BLACK)
                    typeface = android.graphics.Typeface.MONOSPACE
                }
                val p = WindowManager.LayoutParams(
                    WindowManager.LayoutParams.WRAP_CONTENT, WindowManager.LayoutParams.WRAP_CONTENT,
                    WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY,
                    WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCHABLE,
                    PixelFormat.TRANSLUCENT
                ).apply { gravity = Gravity.CENTER }
                wm.addView(hudView, p)
            }

            override fun onStartCommand(intent: Intent?, flags: Int, startId: Int): Int {
                intent?.let {
                    timeOffsetMs = it.getIntExtra("TIME_OFFSET", 0)
                    isAutoMode = it.getBooleanExtra("AUTO_MODE", false)
                }
                Choreographer.getInstance().removeFrameCallback(frameCallback)
                Choreographer.getInstance().postFrameCallback(frameCallback)
                return super.onStartCommand(intent, flags, startId)
            }

            override fun onDestroy() {
                super.onDestroy()
                Choreographer.getInstance().removeFrameCallback(frameCallback)
                if (::hudView.isInitialized) wm.removeView(hudView)
            }
            override fun onBind(i: Intent?): IBinder? = null
        }
        EOF

        # 8. 无障碍服务
        cat << 'EOF' > app/src/main/java/com/example/seckillcloc/AutoSniperService.kt
        package com.example.seckillcloc

        import android.accessibilityservice.AccessibilityService
        import android.accessibilityservice.GestureDescription
        import android.graphics.Path
        import android.view.accessibility.AccessibilityEvent

        class AutoSniperService : AccessibilityService() {
            companion object { var instance: AutoSniperService? = null }
            override fun onServiceConnected() { super.onServiceConnected(); instance = this }
            override fun onAccessibilityEvent(event: AccessibilityEvent?) {}
            override fun onInterrupt() {}
            override fun onUnbind(intent: android.content.Intent?): Boolean { instance = null; return super.onUnbind(intent) }

            fun executeAutoClick(x: Float, y: Float) {
                val path = Path().apply { moveTo(x, y) }
                val gesture = GestureDescription.Builder()
                    .addStroke(GestureDescription.StrokeDescription(path, 0, 10))
                    .build()
                dispatchGesture(gesture, null, null)
            }
        }
        EOF

        # 9. 主界面 MainActivity
        cat << 'EOF' > app/src/main/java/com/example/seckillcloc/MainActivity.kt
        package com.example.seckillcloc

        import android.content.Intent
        import android.net.Uri
        import android.os.Bundle
        import android.provider.Settings
        import android.widget.Button
        import android.widget.RadioButton
        import android.widget.SeekBar
        import android.widget.Switch
        import android.widget.TextView
        import androidx.appcompat.app.AppCompatActivity
        import androidx.lifecycle.lifecycleScope
        import kotlinx.coroutines.Dispatchers
        import kotlinx.coroutines.launch
        import kotlinx.coroutines.withContext

        class MainActivity : AppCompatActivity() {
            private var userOffsetMs: Int = 0

            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                setContentView(R.layout.activity_main)

                val rbTaobao = findViewById<RadioButton>(R.id.rbTaobao)
                val seekBar = findViewById<SeekBar>(R.id.seekBarOffset)
                val tvOffsetVal = findViewById<TextView>(R.id.tvOffsetVal)
                val switchAuto = findViewById<Switch>(R.id.switchAuto)
                val btnDeploy = findViewById<Button>(R.id.btnDeploy)
                val btnTerminate = findViewById<Button>(R.id.btnTerminate)

                seekBar.setOnSeekBarChangeListener(object : SeekBar.OnSeekBarChangeListener {
                    override fun onProgressChanged(sb: SeekBar?, progress: Int, fromUser: Boolean) {
                        userOffsetMs = progress - 500
                        tvOffsetVal.text = "补偿: ${userOffsetMs} ms"
                    }
                    override fun onStartTrackingTouch(sb: SeekBar?) {}
                    override fun onStopTrackingTouch(sb: SeekBar?) {}
                })

                btnDeploy.setOnClickListener {
                    val host = if (rbTaobao.isChecked) "api.m.taobao.com" else "api.m.jd.com"
                    val isAuto = switchAuto.isChecked
                    deployHud(host, userOffsetMs, isAuto)
                }

                btnTerminate.setOnClickListener {
                    stopService(Intent(this, FloatingHudService::class.java))
                }
            }

            private fun deployHud(host: String, userOffset: Int, isAutoMode: Boolean) {
                if (!Settings.canDrawOverlays(this)) {
                    startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))
                    return
                }
                if (isAutoMode && AutoSniperService.instance == null) {
                    startActivity(Intent(Settings.ACTION_ACCESSIBILITY_SETTINGS))
                    return
                }

                lifecycleScope.launch(Dispatchers.IO) {
                    val ntpOffset = NativeTime.syncNtpServer("ntp.aliyun.com")
                    val httpOffset = TimeSynchronizer.syncHttpOffset("https://$host")
                    val networkOffset = if (httpOffset != 0L) httpOffset else ntpOffset
                    val finalOffset = networkOffset + userOffset

                    withContext(Dispatchers.Main) {
                        val intent = Intent(this@MainActivity, FloatingHudService::class.java).apply {
                            putExtra("TIME_OFFSET", finalOffset.toInt())
                            putExtra("AUTO_MODE", isAutoMode)
                        }
                        startService(intent)
                        moveTaskToBack(true)
                    }
                }
            }
        }
        EOF

        # 10. 原生布局
        cat << 'EOF' > app/src/main/res/layout/activity_main.xml
        <?xml version="1.0" encoding="utf-8"?>
        <LinearLayout xmlns:android="http://schemas.android.com/apk/res/android"
            android:layout_width="match_parent"
            android:layout_height="match_parent"
            android:orientation="vertical"
            android:padding="24dp"
            android:gravity="center"
            android:background="#121212">

            <TextView
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="SECKILL HUD MAX"
                android:textSize="28sp"
                android:textStyle="bold"
                android:textColor="#FFFFFF"
                android:layout_marginBottom="32dp"/>

            <RadioGroup
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:orientation="horizontal"
                android:layout_marginBottom="24dp">
                <RadioButton
                    android:id="@+id/rbTaobao"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="淘宝/天猫"
                    android:checked="true"
                    android:textColor="#FFFFFF"
                    android:layout_marginEnd="24dp"/>
                <RadioButton
                    android:id="@+id/rbJd"
                    android:layout_width="wrap_content"
                    android:layout_height="wrap_content"
                    android:text="京东"
                    android:textColor="#FFFFFF"/>
            </RadioGroup>

            <TextView
                android:id="@+id/tvOffsetVal"
                android:layout_width="wrap_content"
                android:layout_height="wrap_content"
                android:text="补偿: 0 ms"
                android:textColor="#FFFFFF"
                android:layout_marginBottom="8dp"/>

            <SeekBar
                android:id="@+id/seekBarOffset"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:max="1000"
                android:progress="500"
                android:layout_marginBottom="24dp"/>

            <Switch
                android:id="@+id/switchAuto"
                android:layout_width="match_parent"
                android:layout_height="wrap_content"
                android:text="自动开火模式 (无障碍)"
                android:textColor="#FFFFFF"
                android:layout_marginBottom="32dp"/>

            <Button
                android:id="@+id/btnDeploy"
                android:layout_width="match_parent"
                android:layout_height="56dp"
                android:text="DEPLOY / 终极部署"
                android:textSize="16sp"
                android:backgroundTint="#FF3B30"
                android:layout_marginBottom="12dp"/>

            <Button
                android:id="@+id/btnTerminate"
                android:layout_width="match_parent"
                android:layout_height="56dp"
                android:text="TERMINATE / 关闭服务"
                android:textSize="16sp"
                android:backgroundTint="#333333"/>
        </LinearLayout>
        EOF

        # 11. 配置与签名保护
        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Seckill HUD MAX</string>
            <string name="accessibility_service_description">Seckill HUD 自动化无障碍点击服务</string>
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/xml/accessibility_service_config.xml
        <accessibility-service xmlns:android="http://schemas.android.com/apk/res/android"
            android:accessibilityEventTypes="typeWindowStateChanged"
            android:accessibilityFeedbackType="feedbackGeneric"
            android:accessibilityFlags="flagDefault"
            android:canPerformGestures="true"
            android:description="@string/app_name"
            android:notificationTimeout="0" />
        EOF

        cat << 'EOF' > app/proguard-rules.pro
        -keep class com.example.seckillcloc.NativeTime { native <methods>; }
        -keep public class com.example.seckillcloc.FloatingHudService { *; }
        -keep public class com.example.seckillcloc.AutoSniperService { *; }
        EOF

        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW" />
            <uses-permission android:name="android.permission.INTERNET" />
            
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.AppCompat.DayNight.NoActionBar">
                <activity
                    android:name=".MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
                <service
                    android:name=".FloatingHudService"
                    android:enabled="true"
                    android:exported="false" />
                <service
                    android:name=".AutoSniperService"
                    android:permission="android.permission.BIND_ACCESSIBILITY_SERVICE"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.accessibilityservice.AccessibilityService" />
                    </intent-filter>
                    <meta-data
                        android:name="android.accessibilityservice"
                        android:resource="@xml/accessibility_service_config" />
                </service>
            </application>
        </manifest>
        EOF

        # 12. 强制使用 Gradle 8.4 版本进行安全打包
        gradle wrapper --gradle-version 8.4
        chmod +x gradlew
        ./gradlew assembleDebug --stacktrace
        
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Seckill-HUD-MAX-Release
        path: app/build/outputs/apk/debug/*.apk
